name: X-Ray Impact Analysis & Safety Gate

on:
  pull_request:
    branches: [ main, master, develop ]

jobs:
  xray-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run X-Ray Blast Radius Analysis
        run: |
          python -m backend.cli diff --base origin/${{ github.base_ref }} --fail-on=HIGH
